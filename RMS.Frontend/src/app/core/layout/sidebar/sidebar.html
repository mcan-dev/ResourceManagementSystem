<div class="sidebar">

  <!-- Üst Kısım: Menü Linkleri -->
  <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">
    Dashboard
  </a>

  <a routerLink="/employee-capacity" routerLinkActive="active" class="menu-item">
    Employee & Capacity
  </a>

  <a routerLink="/projects" routerLinkActive="active" class="menu-item">
    Projects
  </a>

  <a routerLink="/calendar" routerLinkActive="active" class="menu-item">
    Calendar
  </a>

  <a routerLink="/leave-request" routerLinkActive="active" class="menu-item">
    Leave Requests
  </a>

  <a routerLink="/settings" routerLinkActive="active" class="menu-item">
    Settings
  </a>


  <!-- Alt Kısım: Profil Kartı ve Çıkış Butonu -->
  <div class="sidebar-bottom">
    
    <div class="user-profile">
      <div class="avatar">{{ getInitials(employeeName) }}</div>
      <div class="user-info">
        <span class="user-name">{{ employeeName }}</span>
        <span class="user-role">{{ employeeRole }}</span>
      </div>
    </div>

    <button class="logout-btn-sidebar" (click)="logout()">Logout</button>
    
  </div>

</div>
